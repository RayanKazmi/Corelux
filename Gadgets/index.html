<!DOCTYPE html>
<html>
<head>
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-Y4LDHEQ6SL"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-Y4LDHEQ6SL');

  <title>Corelux Gadgets</title>
  <style>
    .navbar {
      background-color: black;
      overflow: hidden;
      border: 1px solid #ccc;
      border-width: 1px 0;
      top: 0;
    }
    
    .navbar a {
      float: left;
      color: white;
      text-align: center;
      padding: 14px 16px;
      text-decoration: none;
    }
    
    .navbar a:hover {
      background-color: #ddd;
      color: black;
      border: 1px solid #ccc;
      border-width: 1px 0;
    }
    
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: black;
    }
    
    .content {
      padding: 20px;
      background-color: black;
      text-align: center;
      color: white;
    }
    
    .header-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    
    .header-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: white;
      font-size: 6rem;
      font-weight: bold;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
      text-align: center;
    }
    
    .header-container {
      position: relative;
      width: 100%;
      height: 300px;
      overflow: hidden;
    }

    .image-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      padding: 20px;
    }

    .image-grid-item {
      flex: 1 1 calc(25% - 40px);
      max-width: calc(25% - 40px);
      box-sizing: border-box;
    }

    .image-container {
      border-radius: 15px;
      overflow: hidden;
      transition: transform 0.2s;
    }

    .image-container img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 15px;
    }

    .image-container:hover {
      transform: scale(1.05);
    }

    .image-text {
      text-align: center;
      margin-top: 10px;
      color: white;
      text-decoration: none;
    }

  </style>
</head>
<body>
  <div class="navbar" id="nav"></div>
  <script>
    const baseUrl = window.location.origin;
    fetch('pages.txt')
      .then(response => response.text())
      .then(data => {
        const links = data.split('\n');
        links.forEach(line => {
          if(line.trim()) {
            const [name, url] = line.split('|');
            const newUrl = url.startsWith('http') ? url : `${baseUrl}${url}`;
            document.getElementById('nav').innerHTML += `<a href="${newUrl}">${name}</a>`;
          }
        });
      });
  </script>
  <div class="header-container">
    <img src="image.jpg" alt="Header Image" class="header-image">
    <div class="header-text">
      Your Bold Header Text
    </div>
  </div>

  <div class="content">
    <p>Being setup</p>
    <p>Thank you for using Corelux!</p>

    <div class="image-grid">
      <div class="image-grid-item">
        <a href="https://example.com/link1" class="image-container">
          <img src="image1.jpg" alt="Image 1">
        </a>
        <a href="https://example.com/link1" class="image-text">Image 1 Description</a>
      </div>
      <div class="image-grid-item">
        <a href="https://example.com/link2" class="image-container">
          <img src="image2.jpg" alt="Image 2">
        </a>
        <a href="https://example.com/link2" class="image-text">Image 2 Description</a>
      </div>
      <div class="image-grid-item">
        <a href="https://example.com/link3" class="image-container">
          <img src="image3.jpg" alt="Image 3">
        </a>
        <a href="https://example.com/link3" class="image-text">Image 3 Description</a>
      </div>
      <div class="image-grid-item">
        <a href="https://example.com/link4" class="image-container">
          <img src="image4.jpg" alt="Image 4">
        </a>
        <a href="https://example.com/link4" class="image-text">Image 4 Description</a>
      </div>
      <!-- Add more image-grid-item divs as needed -->
    </div>
  </div>
</body>
</html>
