<div class="navbar" id="nav">
  <div class="navbar-links" id="navLinks"></div>
  <div class="dropdown" id="moreDropdown">
    <button class="dropbtn">More <span class="arrow"></span></button>
    <div class="dropdown-content" id="dropdownContent"></div>
  </div>
</div>
  <script>
    const baseUrl = window.location.origin;
    
    function checkOverflow() {
      const nav = document.getElementById('nav');
      const navLinks = document.getElementById('navLinks');
      const dropdown = document.getElementById('moreDropdown');
      const dropdownContent = document.getElementById('dropdownContent');
      const links = Array.from(navLinks.getElementsByTagName('a'));
      
      // Reset dropdown content
      dropdownContent.innerHTML = '';
      dropdown.style.display = 'none';
      
      // Show all links initially
      links.forEach(link => {
        link.style.display = 'inline-block';
      });
      
      // Calculate available width (accounting for padding and More button)
      const navWidth = nav.offsetWidth - 100; // Account for padding and More button
      let currentWidth = 0;
      
      for (let i = 0; i < links.length; i++) {
        const link = links[i];
        currentWidth += link.offsetWidth;
        
        if (currentWidth > navWidth) {
          // Move this and all remaining links to dropdown
          const remainingLinks = links.slice(i);
          remainingLinks.forEach(link => {
            link.style.display = 'none';
            dropdownContent.insertAdjacentHTML('beforeend',
              `<a href="${link.href}">${link.textContent}</a>`);
          });
          dropdown.style.display = 'block';
          break;
        }
      }
    }

    fetch('../../pages.txt')
      .then(response => response.text())
      .then(data => {
        const links = data.split('\n');
        links.forEach(line => {
          if(line.trim()) {
            const [name, url] = line.split('|');
            const newUrl = url.startsWith('http') ? url : `${baseUrl}${url}`;
            document.getElementById('navLinks').insertAdjacentHTML('beforeend',
              `<a href="${newUrl}">${name}</a>`);
          }
        });
        
        // Check overflow after adding links
        checkOverflow();
        // Recheck on window resize
        window.addEventListener('resize', checkOverflow);
      });
  </script>

  <script>
    class Dot {
      constructor() {
        this.element = document.createElement('div');
        this.element.className = 'dot';
        this.x = Math.random() * window.innerWidth;
        this.y = Math.random() * window.innerHeight;
        this.size = Math.random() * 8 + 2;
        this.opacity = Math.random() * 0.5 + 0.2;
        this.speedX = (Math.random() - 0.5) * 0.4;
        this.speedY = (Math.random() - 0.5) * 0.4;
        
        this.element.style.width = this.size + 'px';
        this.element.style.height = this.size + 'px';
        this.element.style.opacity = this.opacity;
        document.getElementById('dot-container').appendChild(this.element);
      }

      move() {
        this.x += this.speedX;
        this.y += this.speedY;

        if (this.x < 0 || this.x > window.innerWidth) this.speedX *= -1;
        if (this.y < 0 || this.y > window.innerHeight) this.speedY *= -1;

        this.element.style.transform = `translate(${this.x}px, ${this.y}px)`;
      }
    }

    const dots = Array.from({ length: 100 }, () => new Dot());
    
    function animate() {
      dots.forEach(dot => dot.move());
      requestAnimationFrame(animate);
    }

    animate();
  </script>
