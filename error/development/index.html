<script>
// Configuration variables
const numDots = 200;
const dotSizeMin = 2;
const dotSizeMax = 8;
const dotOpacityMin = 0.3;
const dotOpacityMax = 0.8;
const dotSpeedMin = 0.1;
const dotSpeedMax = 0.3;

class Dot {
  constructor() {
    this.element = document.createElement('div');
    this.element.className = 'dot';
    this.size = Math.random() * (dotSizeMax - dotSizeMin) + dotSizeMin;
    this.x = Math.random() * window.innerWidth; // Use window width
    this.y = Math.random() * window.innerHeight; // Use window height
    this.opacity = Math.random() * (dotOpacityMax - dotOpacityMin) + dotOpacityMin;
    this.speedX = (Math.random() - 0.5) * (dotSpeedMax - dotSpeedMin) * 2 + (Math.random() > 0.5 ? dotSpeedMin : -dotSpeedMin);
    this.speedY = (Math.random() - 0.5) * (dotSpeedMax - dotSpeedMin) * 2 + (Math.random() > 0.5 ? dotSpeedMin : -dotSpeedMin);

    this.element.style.width = this.size + 'px';
    this.element.style.height = this.size + 'px';
    this.element.style.opacity = this.opacity;
    document.body.appendChild(this.element);
  }

  move() {
    this.x += this.speedX;
    this.y += this.speedY;

    // Bounce off window edges
    if (this.x < 0 || this.x > window.innerWidth) {
      this.speedX *= -1;
      if (this.x < 0) this.x = 0; // Prevent dot from going off-screen
      if (this.x > window.innerWidth) this.x = window.innerWidth; // Prevent dot from going off-screen
    }
    if (this.y < 0 || this.y > window.innerHeight) {
      this.speedY *= -1;
      if (this.y < 0) this.y = 0; // Prevent dot from going off-screen
      if (this.y > window.innerHeight) this.y = window.innerHeight; // Prevent dot from going off-screen
    }

    this.element.style.transform = `translate(${this.x}px, ${this.y}px)`;
  }
}

const dots = Array.from({ length: numDots }, () => new Dot());

function animate() {
  dots.forEach(dot => dot.move());
  requestAnimationFrame(animate);
}

animate();

</script>
