<body>
<div class="navbar" id="nav"></div>
  <script>
    fetch('pages.txt')
      .then(response => response.text())
      .then(data => {
        const links = data.split('\n');
        links.forEach(line => {
          if(line.trim()) {
            const [name, url] = line.split('|');
            document.getElementById('nav').innerHTML += `<a href="${url}">${name}</a>`;
          }
        });
      });
  </script>
   <div id="dot-container"></div>
  <div class="content">
    <h1>Error</h1>
    <p>This page is under development</p>
    <p>Please wait while we work on it</p>
    <!-- Add more content to make the page scrollable -->
    <div style="height: 200vh;"></div>
  </div>

  <script>
    class Dot {
      constructor() {
        this.element = document.createElement('div');
        this.element.className = 'dot';
        this.x = Math.random() * window.innerWidth;
        this.y = Math.random() * window.innerHeight;
        this.size = Math.random() * 8 + 2;
        this.opacity = Math.random() * 0.5 + 0.2;
        this.speedX = (Math.random() - 0.5) * 0.5;
        this.speedY = (Math.random() - 0.5) * 0.5;
        
        this.element.style.width = this.size + 'px';
        this.element.style.height = this.size + 'px';
        this.element.style.opacity = this.opacity;
        document.getElementById('dot-container').appendChild(this.element);
      }

      move() {
        this.x += this.speedX;
        this.y += this.speedY;

        if (this.x < 0 || this.x > window.innerWidth) this.speedX *= -1;
        if (this.y < 0 || this.y > window.innerHeight) this.speedY *= -1;

        this.element.style.transform = `translate(${this.x}px, ${this.y}px)`;
      }
    }

    const dots = Array.from({ length: 100 }, () => new Dot());
    
    function animate() {
      dots.forEach(dot => dot.move());
      requestAnimationFrame(animate);
    }

    animate();
  </script>
</body>
