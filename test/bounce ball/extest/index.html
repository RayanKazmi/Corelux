<!DOCTYPE html>
<html>
<head>
<meta name="author" content="RayanKazmi">

<link rel="icon" href="../../favicon.ico">
<title>Better Bounce Ball</title>
<style>
body {
  overflow: hidden;
  margin: 0;
  background-color: #f0f0f0;
  cursor: default;
  user-select: none;
}

#controls {
  position: fixed;
  bottom: 10px;
  right: 10px;
  background-color: rgba(255, 255, 255, 0.9);
  padding: 10px;
  border-radius: 5px;
  box-shadow: 0 0 10px rgba(0,0,0,0.1);
  font-family: Arial, sans-serif;
  z-index: 1000;
  transition: transform 0.3s ease;
}

#controls.hidden {
  transform: translateX(calc(100% - 40px));
}

.controls-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 10px;
  cursor: pointer;
  user-select: none;
}

.controls-header h3 {
  margin: 0;
}

.toggle-arrow {
  transition: transform 0.3s ease;
  display: inline-block;
}

#controls.hidden .toggle-arrow {
  transform: rotate(-90deg);
}

.slider-container {
  margin: 10px 0;
  display: flex;
  align-items: center;
}

.slider-container label {
  width: 120px;
  margin-right: 10px;
}

.slider-container input[type="range"] {
  width: 200px;
  vertical-align: middle;
  margin-right: 10px;
}

.slider-container input[type="text"] {
  width: 70px;
  padding: 2px 5px;
}

#ball, .spawned-ball {
  position: absolute;
  width: 50px;
  height: 50px;
  border-radius: 50%;
  cursor: grab;
  transform-origin: center center;
  user-select: none;
  -webkit-user-select: none;
  -moz-user-select: none;
  -ms-user-select: none;
}

#ball {
  background-color: blue;
}

.spawned-ball {
  background-color: purple;
}

#ball::before {
  content: '';
  position: absolute;
  width: 8px;
  height: 8px;
  background-color: red;
  border-radius: 50%;
  left: 21px;
  top: 5px;
  transform-origin: center center;
  pointer-events: none;
}

#ball.dragging, .spawned-ball.dragging {
  cursor: grabbing;
}

.force-arrow {
  position: absolute;
  height: 3px;
  transform-origin: left center;
  pointer-events: none;
}

.gravity-arrow {
  background-color: red;
}

.friction-arrow {
  background-color: green;
}

.air-friction-arrow {
  background-color: purple;
}

.motion-arrow {
  background-color: orange;
}

.arrow-label {
  position: absolute;
  font-size: 12px;
  color: black;
  white-space: nowrap;
  pointer-events: none;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  user-select: none;
}

.force-value {
  font-size: 10px;
  color: #666;
  margin-top: 2px;
}

#legend {
  position: fixed;
  top: 10px;
  left: 10px;
  background-color: rgba(255, 255, 255, 0.9);
  padding: 10px;
  border-radius: 5px;
  box-shadow: 0 0 10px rgba(0,0,0,0.1);
  font-family: Arial, sans-serif;
  z-index: 1000;
  user-select: none;
}

.legend-item {
  display: flex;
  align-items: center;
  margin: 5px 0;
}

.legend-color {
  width: 20px;
  height: 3px;
  margin-right: 10px;
}

.button-container {
  position: fixed;
  top: 10px;
  right: 10px;
  display: flex;
  gap: 10px;
  z-index: 1000;
}

.control-button {
  padding: 10px 20px;
  color: white;
  border: none;
  border-radius: 5px;
  cursor: pointer;
  font-size: 16px;
  transition: background-color 0.3s;
  user-select: none;
}

#pauseButton {
  background-color: #4CAF50;
}

#pauseButton:hover {
  background-color: #45a049;
}

#spawnButton {
  background-color: #9C27B0;
}

#spawnButton:hover {
  background-color: #7B1FA2;
}

#resetButton {
  background-color: #f44336;
}

#resetButton:hover {
  background-color: #d32f2f;
}

* {
  user-select: none;
  -webkit-user-select: none;
  -moz-user-select: none;
  -ms-user-select: none;
}

input[type="text"] {
  user-select: text;
  -webkit-user-select: text;
  -moz-user-select: text;
  -ms-user-select: text;
  cursor: text;
}
</style>
</head>
<body>

<div id="ball"></div>

<div id="legend">
  <div class="legend-item">
    <div class="legend-color" style="background-color: red;"></div>
    <span>Gravity: <span id="gravityValue">0.000</span></span>
  </div>
  <div class="legend-item">
    <div class="legend-color" style="background-color: green;"></div>
    <span>Ground Friction: <span id="frictionValue">0.000</span></span>
  </div>
  <div class="legend-item">
    <div class="legend-color" style="background-color: purple;"></div>
    <span>Air Friction: <span id="airFrictionValue">0.000</span></span>
  </div>
  <div class="legend-item">
    <div class="legend-color" style="background-color: orange;"></div>
    <span>Motion: <span id="motionValue">0.000</span></span>
  </div>
</div>

<div class="button-container">
  <button id="resetButton" class="control-button">Reset</button>
  <button id="spawnButton" class="control-button">Spawn Ball</button>
  <button id="pauseButton" class="control-button">Pause</button>
</div>

<div id="controls">
  <div class="controls-header">
    <h3>Controls</h3>
    <span class="toggle-arrow">▼</span>
  </div>
  <div class="slider-container">
    <label for="gravitySlider">Gravity:</label>
    <input type="range" id="gravitySlider" min="-1" max="1" step="0.01" value="0.3">
    <input type="text" id="gravityNumber" pattern="[0-9]*\.?[0-9]*" value="0.3">
  </div>
  <div class="slider-container">
    <label for="airFrictionSlider">Air Friction:</label>
    <input type="range" id="airFrictionSlider" min="-1" max="1" step="0.01" value="0.005">
    <input type="text" id="airFrictionNumber" pattern="[0-9]*\.?[0-9]*" value="0.005">
  </div>
  <div class="slider-container">
    <label for="groundFrictionSlider">Ground Friction:</label>
    <input type="range" id="groundFrictionSlider" min="-1" max="1" step="0.01" value="0.02">
    <input type="text" id="groundFrictionNumber" pattern="[0-9]*\.?[0-9]*" value="0.02">
  </div>
  <div class="slider-container">
    <label for="bounceSlider">Bounce:</label>
    <input type="range" id="bounceSlider" min="0" max="2" step="0.01" value="0.8">
    <input type="text" id="bounceNumber" pattern="[0-9]*\.?[0-9]*" value="0.8">
  </div>
</div>

<script>
const ball = document.getElementById('ball');
let spawnedBalls = [];
const INITIAL_X = window.innerWidth / 2;
const INITIAL_Y = window.innerHeight / 2;
let x = INITIAL_X;
let y = INITIAL_Y;
let dx = 0;
let dy = 0;
let rotation = 0;
let isDragging = false;
let dragOffsetX = 0;
let dragOffsetY = 0;
let lastMouseX = 0;
let lastMouseY = 0;
let prevMouseX = 0;
let prevMouseY = 0;
let isPaused = false;
let currentDraggedBall = null;
const FORCE_THRESHOLD = 0.0001;
const VELOCITY_THRESHOLD = 0.01;
const COLLISION_ELASTICITY = 0.8;

const INITIAL_VALUES = {
    gravity: 0.3,
    airFriction: 0.005,
    groundFriction: 0.02,
    bounce: 0.8
};

let gravity = INITIAL_VALUES.gravity;
let airFriction = INITIAL_VALUES.airFriction;
let groundFriction = INITIAL_VALUES.groundFriction;
let bounce = INITIAL_VALUES.bounce;
const BALL_CIRCUMFERENCE = 50 * Math.PI;
const BALL_RADIUS = 25;

// Add this function to your script for handling ball collisions
function handleBallCollision(ball1, ball2) {
    const dx = ball2.x - ball1.x;
    const dy = ball2.y - ball1.y;
    const distance = Math.sqrt(dx * dx + dy * dy);

    if (distance < BALL_DIAMETER) {
        const angle = Math.atan2(dy, dx);
        const sin = Math.sin(angle);
        const cos = Math.cos(angle);

        // Rotate velocities to simplify calculations
        const v1 = { x: ball1.dx * cos + ball1.dy * sin, y: ball1.dy * cos - ball1.dx * sin };
        const v2 = { x: ball2.dx * cos + ball2.dy * sin, y: ball2.dy * cos - ball2.dx * sin };

        // Exchange velocities based on bounce factor
        const v1Final = ((v1.x * (1 - bounce)) + (2 * bounce * v2.x)) / 2;
        const v2Final = ((v2.x * (1 - bounce)) + (2 * bounce * v1.x)) / 2;

        // Rotate velocities back
        ball1.dx = v1Final * cos - v1.y * sin;
        ball1.dy = v1.y * cos + v1Final * sin;
        ball2.dx = v2Final * cos - v2.y * sin;
        ball2.dy = v2.y * cos + v2Final * sin;

        // Move overlapping balls apart
        const overlap = BALL_DIAMETER - distance;
        const moveX = (overlap * cos) / 2;
        const moveY = (overlap * sin) / 2;

        ball1.x -= moveX;
        ball1.y -= moveY;
        ball2.x += moveX;
        ball2.y += moveY;

        return true;
    }
    return false;
}
  
// Update this function to handle all collisions
function handleAllCollisions() {
    // Check collision between main ball and purple balls
    spawnedBalls.forEach(spawnedBall => {
        if (handleBallCollision({ x, y, dx, dy }, spawnedBall)) {
            ball.style.left = x + 'px';
            ball.style.top = y + 'px';
            spawnedBall.element.style.left = spawnedBall.x + 'px';
            spawnedBall.element.style.top = spawnedBall.y + 'px';
        }
    });

    // Check collisions between purple balls
    for (let i = 0; i < spawnedBalls.length; i++) {
        for (let j = i + 1; j < spawnedBalls.length; j++) {
            if (handleBallCollision(spawnedBalls[i], spawnedBalls[j])) {
                spawnedBalls[i].element.style.left = spawnedBalls[i].x + 'px';
                spawnedBalls[i].element.style.top = spawnedBalls[i].y + 'px';
                spawnedBalls[j].element.style.left = spawnedBalls[j].x + 'px';
                spawnedBalls[j].element.style.top = spawnedBalls[j].y + 'px';
            }
        }
    }
}

// Update the updateBallPosition function to include handleAllCollisions
function updateBallPosition() {
    if (!isPaused) {
        // Apply forces and update main ball's position
        if (!isDragging) {
            dy += gravity;
            dx *= (1 - airFriction); dy *= (1 - airFriction);

            if (y + BALL_DIAMETER >= window.innerHeight) {
                dx *= (1 - groundFriction); dy = -dy * bounce;
                y = Math.min(y, window.innerHeight - BALL_DIAMETER);
            }

            x += dx; y += dy;

            if (x + BALL_DIAMETER > window.innerWidth || x < 0) {
                dx = -dx * bounce;
                x = Math.max(0, Math.min(x, window.innerWidth - BALL_DIAMETER));
            }
        }

        ball.style.left = x + 'px';
        ball.style.top = y + 'px';

        // Update purple balls
        spawnedBalls.forEach(ball => {
            ball.dy += gravity;
            ball.dx *= (1 - airFriction); ball.dy *= (1 - airFriction);

            ball.x += ball.dx; ball.y += ball.dy;

            if (ball.y + BALL_DIAMETER >= window.innerHeight) {
                ball.dy = -ball.dy * bounce;
                ball.dx *= (1 - groundFriction);
                ball.y = Math.min(ball.y, window.innerHeight - BALL_DIAMETER);
            }
            ball.element.style.left = ball.x + 'px';
            ball.element.style.top = ball.y + 'px';
        });

        handleAllCollisions();
    }

    requestAnimationFrame(updateBallPosition);
}
  
function checkCollision(ball1, ball2) {
    const dx = (ball2.x + BALL_RADIUS) - (ball1.x + BALL_RADIUS);
    const dy = (ball2.y + BALL_RADIUS) - (ball1.y + BALL_RADIUS);
    const distance = Math.sqrt(dx * dx + dy * dy);
    
    if (distance < BALL_RADIUS * 2) {
        const angle = Math.atan2(dy, dx);
        const sin = Math.sin(angle);
        const cos = Math.cos(angle);

        // Rotate velocities
        const vx1 = ball1.dx * cos + ball1.dy * sin;
        const vy1 = ball1.dy * cos - ball1.dx * sin;
        const vx2 = ball2.dx * cos + ball2.dy * sin;
        const vy2 = ball2.dy * cos - ball2.dx * sin;

        // Collision response
        const v1Final = ((vx1 * (1 - COLLISION_ELASTICITY)) + (2 * COLLISION_ELASTICITY * vx2)) / 2;
        const v2Final = ((vx2 * (1 - COLLISION_ELASTICITY)) + (2 * COLLISION_ELASTICITY * vx1)) / 2;

        // Rotate velocities back
        ball1.dx = v1Final * cos - vy1 * sin;
        ball1.dy = vy1 * cos + v1Final * sin;
        ball2.dx = v2Final * cos - vy2 * sin;
        ball2.dy = vy2 * cos + v2Final * sin;

        // Move balls apart to prevent sticking
        const overlap = (BALL_RADIUS * 2) - distance;
        const moveX = (overlap * cos) / 2;
        const moveY = (overlap * sin) / 2;

        ball1.x -= moveX;
        ball1.y -= moveY;
        ball2.x += moveX;
        ball2.y += moveY;

        return true;
    }
    return false;
}

function handleCollisions() {
    // Check main ball against spawned balls
    spawnedBalls.forEach(spawnedBall => {
        if (checkCollision(
            {x, y, dx, dy},
            spawnedBall
        )) {
            // Update main ball position
            ball.style.left = x + 'px';
            ball.style.top = y + 'px';
            
            // Update spawned ball position
            spawnedBall.element.style.left = spawnedBall.x + 'px';
            spawnedBall.element.style.top = spawnedBall.y + 'px';
        }
    });

    // Check spawned balls against each other
    for (let i = 0; i < spawnedBalls.length; i++) {
        for (let j = i + 1; j < spawnedBalls.length; j++) {
            if (checkCollision(spawnedBalls[i], spawnedBalls[j])) {
                spawnedBalls[i].element.style.left = spawnedBalls[i].x + 'px';
                spawnedBalls[i].element.style.top = spawnedBalls[i].y + 'px';
                spawnedBalls[j].element.style.left = spawnedBalls[j].x + 'px';
                spawnedBalls[j].element.style.top = spawnedBalls[j].y + 'px';
            }
        }
    }
}

const gravityValueElement = document.getElementById('gravityValue');
const frictionValueElement = document.getElementById('frictionValue');
const airFrictionValueElement = document.getElementById('airFrictionValue');
const motionValueElement = document.getElementById('motionValue');
const pauseButton = document.getElementById('pauseButton');
const spawnButton = document.getElementById('spawnButton');
const resetButton = document.getElementById('resetButton');
const controlsPanel = document.getElementById('controls');
const controlsHeader = document.querySelector('.controls-header');

controlsHeader.addEventListener('click', () => {
    controlsPanel.classList.toggle('hidden');
});

const gravitySlider = document.getElementById('gravitySlider');
const airFrictionSlider = document.getElementById('airFrictionSlider');
const groundFrictionSlider = document.getElementById('groundFrictionSlider');
const bounceSlider = document.getElementById('bounceSlider');

const gravityNumber = document.getElementById('gravityNumber');
const airFrictionNumber = document.getElementById('airFrictionNumber');
const groundFrictionNumber = document.getElementById('groundFrictionNumber');
const bounceNumber = document.getElementById('bounceNumber');

function syncInputs(slider, number, callback) {
    slider.oninput = () => {
        let value = parseFloat(slider.value);
        if (Math.abs(value) < 0.1 && slider.id !== 'bounceSlider') {
            value = 0;
            slider.value = "0";
        }
        number.value = value;
        callback(value);
    };

    number.oninput = number.onchange = () => {
        let value = parseFloat(number.value);
        if (isNaN(value)) return;
        
        if (value >= parseFloat(slider.min) && value <= parseFloat(slider.max)) {
            slider.value = value;
        }
        
        callback(value);
    };
}

syncInputs(gravitySlider, gravityNumber, value => gravity = value);
syncInputs(airFrictionSlider, airFrictionNumber, value => airFriction = value);
syncInputs(groundFrictionSlider, groundFrictionNumber, value => groundFriction = value);
syncInputs(bounceSlider, bounceNumber, value => bounce = value);

function resetSimulation() {
    x = INITIAL_X;
    y = INITIAL_Y;
    dx = 0;
    dy = 0;
    rotation = 0;
    
    gravity = INITIAL_VALUES.gravity;
    airFriction = INITIAL_VALUES.airFriction;
    groundFriction = INITIAL_VALUES.groundFriction;
    bounce = INITIAL_VALUES.bounce;
    
    gravitySlider.value = gravity;
    airFrictionSlider.value = airFriction;
    groundFrictionSlider.value = groundFriction;
    bounceSlider.value = bounce;
    
    gravityNumber.value = gravity;
    airFrictionNumber.value = airFriction;
    groundFrictionNumber.value = groundFriction;
    bounceNumber.value = bounce;
    
    spawnedBalls.forEach(ball => {
        ball.element.remove();
    });
    spawnedBalls = [];
    
    ball.style.left = x + 'px';
    ball.style.top = y + 'px';
    ball.style.transform = `rotate(${rotation}deg)`;
}

const createArrow = (className) => {
    const arrow = document.createElement('div');
    arrow.className = `force-arrow ${className}`;
    document.body.appendChild(arrow);
    
    const labelContainer = document.createElement('div');
    labelContainer.className = 'arrow-label';
    
    const label = document.createElement('div');
    labelContainer.appendChild(label);
    
    const value = document.createElement('div');
    value.className = 'force-value';
    labelContainer.appendChild(value);
    
    document.body.appendChild(labelContainer);
    
    return { arrow, labelContainer, label, value };
};

const { arrow: gravityArrow, labelContainer: gravityLabelContainer, label: gravityLabel, value: gravityValue } = createArrow('gravity-arrow');
const { arrow: frictionArrow, labelContainer: frictionLabelContainer, label: frictionLabel, value: frictionValue } = createArrow('friction-arrow');
const { arrow: airFrictionArrow, labelContainer: airFrictionLabelContainer, label: airFrictionLabel, value: airFrictionValue } = createArrow('air-friction-arrow');
const { arrow: motionArrow, labelContainer: motionLabelContainer, label: motionLabel, value: motionValue } = createArrow('motion-arrow');

function formatForceValue(value) {
    return value.toFixed(3);
}

function updateArrow(arrow, labelContainer, label, valueElement, startX, startY, force, angle, text) {
    if (Math.abs(force) < FORCE_THRESHOLD) {
        force = 0;
        arrow.style.display = 'none';
        labelContainer.style.display = 'none';
        return 0;
    }
    
    arrow.style.display = 'block';
    labelContainer.style.display = 'block';
    
    const arrowLength = Math.abs(force) * 10;
    
    arrow.style.left = startX + 25 + 'px';
    arrow.style.top = startY + 25 + 'px';
    arrow.style.width = arrowLength + 'px';
    arrow.style.transform = `rotate(${angle}deg)`;
    
    const labelX = startX + 25 + (arrowLength / 2) * Math.cos(angle * Math.PI / 180);
    const labelY = startY + 25 + (arrowLength / 2) * Math.sin(angle * Math.PI / 180);
    
    labelContainer.style.left = labelX + 'px';
    labelContainer.style.top = labelY - 20 + 'px';
    label.textContent = text;
    valueElement.textContent = `Force: ${formatForceValue(force)}`;
    
    return force;
}

function createSpawnedBall() {
    const spawnedBall = document.createElement('div');
    spawnedBall.className = 'spawned-ball';
    spawnedBall.style.left = INITIAL_X + 'px';
    spawnedBall.style.top = INITIAL_Y + 'px';
    document.body.appendChild(spawnedBall);
    
    const ballData = {
        element: spawnedBall,
        x: INITIAL_X,
        y: INITIAL_Y,
        dx: dx * 1.2,
        dy: dy * 1.2,
        rotation: 0,
        isDragging: false,
        dragOffsetX: 0,
        dragOffsetY: 0,
        lastMouseX: 0,
        lastMouseY: 0,
        prevMouseX: 0,
        prevMouseY: 0
    };

    spawnedBall.addEventListener('mousedown', (e) => {
        ballData.isDragging = true;
        spawnedBall.classList.add('dragging');
        ballData.dx = 0;
        ballData.dy = 0;
        ballData.dragOffsetX = e.clientX - ballData.x;
        ballData.dragOffsetY = e.clientY - ballData.y;
        ballData.lastMouseX = e.clientX;
        ballData.lastMouseY = e.clientY;
        ballData.prevMouseX = e.clientX;
        ballData.prevMouseY = e.clientY;
        currentDraggedBall = ballData;
    });
    
    return ballData;
}

function updateBallRotation(ballObject, element) {
    const rotationDelta = (ballObject.dx / BALL_CIRCUMFERENCE) * 360;
    ballObject.rotation = (ballObject.rotation + rotationDelta) % 360;
    element.style.transform = `rotate(${ballObject.rotation}deg)`;
}

function updateSpawnedBall(spawnedBall) {
    if (!isPaused && !spawnedBall.isDragging) {
        spawnedBall.dy += gravity;
        
        if (airFriction > 0) {
            if (airFriction >= 1) {
                spawnedBall.dx = 0;
                spawnedBall.dy = 0;
            } else {
                spawnedBall.dx *= (1 - airFriction);
                spawnedBall.dy *= (1 - airFriction);
            }
        } else if (airFriction < 0) {
            spawnedBall.dx *= (1 + Math.abs(airFriction));
            spawnedBall.dy *= (1 + Math.abs(airFriction));
        }
        
        if (spawnedBall.y + 50 >= window.innerHeight) {
            if (groundFriction > 0) {
                if (groundFriction >= 1) {
                    spawnedBall.dx = 0;
                } else {
                    spawnedBall.dx *= (1 - groundFriction);
                }
            } else if (groundFriction < 0) {
                spawnedBall.dx *= (1 + Math.abs(groundFriction));
            }
            
            if (Math.abs(spawnedBall.dy) < VELOCITY_THRESHOLD) {
                spawnedBall.dy = 0;
                spawnedBall.y = window.innerHeight - 50;
            }
        }

        spawnedBall.x += spawnedBall.dx;
        spawnedBall.y += spawnedBall.dy;

        if (spawnedBall.x + 50 > window.innerWidth) {
            spawnedBall.x = window.innerWidth - 50;
            spawnedBall.dx = -spawnedBall.dx * bounce;
        } else if (spawnedBall.x < 0) {
            spawnedBall.x = 0;
            spawnedBall.dx = -spawnedBall.dx * bounce;
        }

        if (spawnedBall.y + 50 > window.innerHeight) {
            spawnedBall.y = window.innerHeight - 50;
            spawnedBall.dy = -spawnedBall.dy * bounce;
        } else if (spawnedBall.y < 0) {
            spawnedBall.y = 0;
            spawnedBall.dy = -spawnedBall.dy * bounce;
        }

        updateBallRotation(spawnedBall, spawnedBall.element);
        
        spawnedBall.element.style.left = spawnedBall.x + 'px';
        spawnedBall.element.style.top = spawnedBall.y + 'px';
    }
}

function updateBallPosition() {
    if (!isPaused) {
        if (!isDragging) {
            dy += gravity;
            
            if (airFriction > 0) {
                if (airFriction >= 1) {
                    dx = 0;
                    dy = 0;
                } else {
                    dx *= (1 - airFriction);
                    dy *= (1 - airFriction);
                }
            } else if (airFriction < 0) {
                dx *= (1 + Math.abs(airFriction));
                dy *= (1 + Math.abs(airFriction));
            }
            
            if (y + 50 >= window.innerHeight) {
                if (groundFriction > 0) {
                    if (groundFriction >= 1) {
                        dx = 0;
                    } else {
                        dx *= (1 - groundFriction);
                    }
                } else if (groundFriction < 0) {
                    dx *= (1 + Math.abs(groundFriction));
                }
                
                if (Math.abs(dy) < VELOCITY_THRESHOLD) {
                    dy = 0;
                    y = window.innerHeight - 50;
                }
            }

            x += dx;
            y += dy;

            if (x + 50 > window.innerWidth) {
                x = window.innerWidth - 50;
                dx = -dx * bounce;
            } else if (x < 0) {
                x = 0;
                dx = -dx * bounce;
            }

            if (y + 50 > window.innerHeight) {
                y = window.innerHeight - 50;
                dy = -dy * bounce;
            } else if (y < 0) {
                y = 0;
                dy = -dy * bounce;
            }

            updateBallRotation({dx, rotation}, ball);
        }

        ball.style.left = x + 'px';
        ball.style.top = y + 'px';
        
        spawnedBalls.forEach(updateSpawnedBall);
        
        // Handle collisions between all balls
        handleCollisions();
    }

    const gravityForce = updateArrow(gravityArrow, gravityLabelContainer, gravityLabel, gravityValue, 
                                   x, y, Math.abs(gravity), 90, 'Gravity');
    gravityValueElement.textContent = formatForceValue(gravityForce);
    
    let groundFrictionForce = 0;
    if (y + 50 >= window.innerHeight && Math.abs(dx) > 0) {
        const frictionAngle = dx > 0 ? 180 : 0;
        const frictionMagnitude = Math.abs(dx * groundFriction);
        groundFrictionForce = updateArrow(frictionArrow, frictionLabelContainer, frictionLabel, frictionValue,
                                        x, y, frictionMagnitude, frictionAngle, 'Ground Friction');
    } else {
        frictionArrow.style.display = 'none';
        frictionLabelContainer.style.display = 'none';
        groundFrictionForce = 0;
    }
    frictionValueElement.textContent = formatForceValue(groundFrictionForce);
    
    const airFrictionMagnitude = Math.sqrt(dx * dx + dy * dy) * Math.abs(airFriction);
    const airFrictionForce = updateArrow(airFrictionArrow, airFrictionLabelContainer, airFrictionLabel, airFrictionValue,
                                       x, y, airFrictionMagnitude, Math.atan2(dy, dx) * 180 / Math.PI + 180, 'Air Friction');
    airFrictionValueElement.textContent = formatForceValue(airFrictionForce);
    
    const speed = Math.sqrt(dx * dx + dy * dy);
    const motionForce = updateArrow(motionArrow, motionLabelContainer, motionLabel, motionValue,
                                  x, y, speed, Math.atan2(dy, dx) * 180 / Math.PI, 'Motion');
    motionValueElement.textContent = formatForceValue(motionForce);

    if (!isPaused) {
        requestAnimationFrame(updateBallPosition);
    }
}

pauseButton.addEventListener('click', () => {
    isPaused = !isPaused;
    pauseButton.textContent = isPaused ? 'Resume' : 'Pause';
    if (!isPaused) {
        requestAnimationFrame(updateBallPosition);
    }
});

spawnButton.addEventListener('click', () => {
    const newBall = createSpawnedBall();
    spawnedBalls.push(newBall);
});

resetButton.addEventListener('click', resetSimulation);

ball.addEventListener('mousedown', (e) => {
    isDragging = true;
    ball.classList.add('dragging');
    dx = 0;
    dy = 0;
    dragOffsetX = e.clientX - x;
    dragOffsetY = e.clientY - y;
    lastMouseX = e.clientX;
    lastMouseY = e.clientY;
    prevMouseX = e.clientX;
    prevMouseY = e.clientY;
});

window.addEventListener('mousemove', (e) => {
    if (isDragging) {
        const newX = e.clientX - dragOffsetX;
        const newY = e.clientY - dragOffsetY;
        
        dx = e.clientX - lastMouseX;
        dy = e.clientY - lastMouseY;
        
        x = newX;
        y = newY;

        updateBallRotation({dx, rotation}, ball);

        prevMouseX = lastMouseX;
        prevMouseY = lastMouseY;
        lastMouseX = e.clientX;
        lastMouseY = e.clientY;
    } else if (currentDraggedBall) {
        const newX = e.clientX - currentDraggedBall.dragOffsetX;
        const newY = e.clientY - currentDraggedBall.dragOffsetY;
        
        currentDraggedBall.dx = e.clientX - currentDraggedBall.lastMouseX;
        currentDraggedBall.dy = e.clientY - currentDraggedBall.lastMouseY;
        
        currentDraggedBall.x = newX;
        currentDraggedBall.y = newY;

        updateBallRotation(currentDraggedBall, currentDraggedBall.element);

        currentDraggedBall.prevMouseX = currentDraggedBall.lastMouseX;
        currentDraggedBall.prevMouseY = currentDraggedBall.lastMouseY;
        currentDraggedBall.lastMouseX = e.clientX;
        currentDraggedBall.lastMouseY = e.clientY;
        
        currentDraggedBall.element.style.left = currentDraggedBall.x + 'px';
        currentDraggedBall.element.style.top = currentDraggedBall.y + 'px';
    }
});

window.addEventListener('mouseup', (e) => {
    if (isDragging) {
        isDragging = false;
        ball.classList.remove('dragging');
        dx = (lastMouseX - prevMouseX);
        dy = (lastMouseY - prevMouseY);
        lastMouseX = 0;
        lastMouseY = 0;
        prevMouseX = 0;
        prevMouseY = 0;
    }
    if (currentDraggedBall) {
        currentDraggedBall.isDragging = false;
        currentDraggedBall.element.classList.remove('dragging');
        currentDraggedBall.dx = (currentDraggedBall.lastMouseX - currentDraggedBall.prevMouseX);
        currentDraggedBall.dy = (currentDraggedBall.lastMouseY - currentDraggedBall.prevMouseY);
        currentDraggedBall.lastMouseX = 0;
        currentDraggedBall.lastMouseY = 0;
        currentDraggedBall.prevMouseX = 0;
        currentDraggedBall.prevMouseY = 0;
        currentDraggedBall = null;
    }
});

window.addEventListener("blur", () => {
    if (isDragging) {
        isDragging = false;
        ball.classList.remove('dragging');
        lastMouseX = 0;
        lastMouseY = 0;
        prevMouseX = 0;
        prevMouseY = 0;
    }
    if (currentDraggedBall) {
        currentDraggedBall.isDragging = false;
        currentDraggedBall.element.classList.remove('dragging');
        currentDraggedBall.lastMouseX = 0;
        currentDraggedBall.lastMouseY = 0;
        currentDraggedBall.prevMouseX = 0;
        currentDraggedBall.prevMouseY = 0;
        currentDraggedBall = null;
    }
});

ball.style.left = x + 'px';
ball.style.top = y + 'px';
updateBallPosition();
</script>

</body>
</html>
