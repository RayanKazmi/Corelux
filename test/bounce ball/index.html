<!DOCTYPE html>
<html>
<head>
<title>Bouncing Ball</title>
<style>
body {
  overflow: hidden;
  margin: 0;
  background-color: #f0f0f0;
  cursor: default; /* Default cursor */
}

#ball {
  position: absolute;
  width: 50px;
  height: 50px;
  border-radius: 50%;
  background-color: blue;
  cursor: grab; /* Change cursor on hover */
}
#ball.dragging {
    cursor: grabbing; /* Change cursor when dragging*/
}
</style>
</head>
<body>

<div id="ball"></div>

<script>
const ball = document.getElementById('ball');
let x = window.innerWidth / 2;
let y = window.innerHeight / 2;
let dx = 0;
let dy = 0;
let isDragging = false;
let dragOffsetX = 0;
let dragOffsetY = 0;
let lastMouseX = 0;
let lastMouseY = 0;
const friction = 0.98;
const gravity = 0.2;

function updateBallPosition() {
    if (!isDragging) {
        dy += gravity;
        dx *= friction;
        dy *= friction;

        x += dx;
        y += dy;

        if (x + 50 > window.innerWidth || x < 0) {
            dx = -dx;
            x = x + (x + 50 > window.innerWidth ? -((x+50) - window.innerWidth) : -x);
        }
        if (y + 50 > window.innerHeight || y < 0) {
            dy = -dy;
            y = y + (y + 50 > window.innerHeight ? -((y+50) - window.innerHeight) : -y);
        }

        ball.style.left = x + 'px';
        ball.style.top = y + 'px';
    }

    requestAnimationFrame(updateBallPosition);
}

ball.addEventListener('mousedown', (e) => {
    isDragging = true;
    ball.classList.add('dragging');
    dragOffsetX = e.clientX - x;
    dragOffsetY = e.clientY - y;
    lastMouseX = e.clientX;
    lastMouseY = e.clientY;
});

window.addEventListener('mousemove', (e) => {
    if (isDragging) {
        x = e.clientX - dragOffsetX;
        y = e.clientY - dragOffsetY;

        ball.style.left = x + 'px';
        ball.style.top = y + 'px';
    }
});

window.addEventListener('mouseup', (e) => {
    if (isDragging) {
        isDragging = false;
        ball.classList.remove('dragging');
        dx = e.clientX - lastMouseX;
        dy = e.clientY - lastMouseY;
        lastMouseX = 0;
        lastMouseY = 0;
    }
});

//Prevent dragging outside of window
window.addEventListener("blur", () => {
    if (isDragging) {
        isDragging = false;
        ball.classList.remove('dragging');
        lastMouseX = 0;
        lastMouseY = 0;
    }
})

ball.style.left = x + 'px';
ball.style.top = y + 'px';
updateBallPosition();

</script>

</body>
</html>
