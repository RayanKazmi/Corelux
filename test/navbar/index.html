<!DOCTYPE html>
<html>
<head>
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-Y4LDHEQ6SL"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-Y4LDHEQ6SL');
</script>
  <title>Corelux Credits</title>
  <style>
    .navbar {
      background-color: black;
      overflow: hidden;
      border: 1px solid #ccc;
      border-width: 1px 0;
      top: 0;
      width: 100%;
      position: fixed;
      z-index: 1000;
      display: flex;
      justify-content: space-around;
      padding: 0 20px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    .navbar a {
      float: left;
      color: white;
      text-align: center;
      padding: 14px 16px;
      text-decoration: none;
      font-weight: bold;
      display: block;
      position: relative;
    }

    .navbar a:hover {
      background-color: #ddd;
      color: black;
    }

    .navbar .dropdown {
      display: inline-block;
      position: relative;
    }

    .navbar .dropdown-content {
      display: none;
      position: absolute;
      background-color: #f9f9f9;
      min-width: 160px;
      box-shadow: 0 8px 16px rgba(0,0,0,0.2);
      z-index: 1;
      top: 100%;
      left: 0;
    }

    .navbar .dropdown-content a {
      color: black;
      padding: 12px 16px;
      text-decoration: none;
      display: block;
      text-align: left;
    }

    .navbar .dropdown-content a:hover {
      background-color: #ddd;
    }

    .navbar .dropdown:hover .dropdown-content {
      display: block;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: black;
      padding-top: 50px; /* Adjust based on navbar height */
    }

    .content {
      padding: 20px;
      background-color: black;
      text-align: center;
      color: white;
    }

    .header-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .header-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: white;
      font-size: 6rem;
      font-weight: bold;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
      text-align: center;
    }

    .header-container {
      position: relative;
      width: 100%;
      height: 500px;
      overflow: hidden;
    }
  </style>
</head>
<body>
<div class="navbar" id="nav"></div>
  <script>
    const baseUrl = window.location.origin;
    fetch('pages.txt')
      .then(response => response.text())
      .then(data => {
        const lines = data.split('\n');
        lines.forEach(line => {
          line = line.trim();
          if (line.startsWith('Dropdown')) {
            const dropdownName = line.match(/Dropdown\d+\[(.*)\]/)[1].trim();
            const dropdown = document.createElement('div');
            dropdown.className = 'dropdown';
            dropdown.innerHTML = `<a href="#">${dropdownName}</a><div class="dropdown-content"></div>`;
            document.getElementById('nav').appendChild(dropdown);
            const dropdownContent = dropdown.querySelector('.dropdown-content');
            const links = line.match(/\[(.*)\]/)[1].split('\n');
            links.forEach(link => {
              const [name, url] = link.split('|');
              const newUrl = url.startsWith('http') ? url : `${baseUrl}${url}`;
              dropdownContent.innerHTML += `<a href="${newUrl.trim()}">${name.trim()}</a>`;
            });
          } else if (line) {
            const [name, url] = line.split('|');
            const newUrl = url.startsWith('http') ? url : `${baseUrl}${url}`;
            document.getElementById('nav').innerHTML += `<a href="${newUrl.trim()}">${name.trim()}</a>`;
          }
        });
      });
  </script>
  <div class="header-container">
        <img src="image.jpg" alt="Header Image" class="header-image">
        <div class="header-text">
            Your Bold Header Text
        </div>
    </div>

  <div class="content">
    <h1>The Corelux HTML Crew</h1>
    <p>Being setup</p>
    <p>Thank you for using Corelux!</p>
  </div>
</body>
</html>
