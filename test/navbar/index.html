<!DOCTYPE html>
<html>
<head>

     crossorigin="anonymous"></script>

  <title>Corelux</title>
  <style>
    .navbar {
      background-color: #111;
      overflow: visible; /* Changed to visible to show dropdown */
      border-bottom: 1px solid #444;
      position: fixed;
      width: 100%;
      top: 0;
      z-index: 1000;
      padding: 5px 10px;
    }
    
    .navbar a {
      float: left;
      color: white;
      text-align: center;
      padding: 18px 20px;
      text-decoration: none;
      font-size: 18px;
      transition: background-color 0.3s, color 0.3s;
      border-radius: 4px;
    }
    
    .navbar a:hover {
      background-color: #5f6368;
      color: white;
    }

    /* Dropdown styles */
    .dropdown {
      float: left;
      overflow: hidden;
      display: none; /* Hidden by default */
    }

    .dropdown .dropbtn {
      color: white;
      padding: 18px 20px;
      background-color: inherit;
      font-family: inherit;
      font-size: 18px;
      margin: 0;
      border: none;
      outline: none;
      cursor: pointer;
      transition: background-color 0.3s, color 0.3s;
      border-radius: 4px;
    }

    .dropdown:hover .dropbtn {
      background-color: #5f6368;
    }

    .dropdown-content {
      display: none;
      position: absolute;
      background-color: #111;
      min-width: 160px;
      box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.2);
      z-index: 1001;
      border-radius: 4px;
    }

    .dropdown-content a {
      float: none;
      color: white;
      padding: 12px 16px;
      text-decoration: none;
      display: block;
      text-align: left;
    }

    .dropdown:hover .dropdown-content {
      display: block;
    }
    
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: black;
      padding-top: 50px;
    }
    
    .content {
      padding: 20px;
      background-color: black;
      text-align: center;
      color: white;
    }
    
    .header-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .header-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: white;
      font-size: 6rem;
      font-weight: bold;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
      text-align: center;
    }
    .header-container {
      position: relative;
      width: 100%;
      height: 300px;
      overflow: hidden;
    }
  </style>
</head>
<body>
<div class="navbar" id="nav">
  <div class="dropdown" id="moreDropdown">
    <button class="dropbtn">More</button>
    <div class="dropdown-content" id="dropdownContent"></div>
  </div>
</div>
  <script>
    const baseUrl = window.location.origin;
    
    function checkOverflow() {
      const nav = document.getElementById('nav');
      const dropdown = document.getElementById('moreDropdown');
      const dropdownContent = document.getElementById('dropdownContent');
      const navLinks = nav.getElementsByTagName('a');
      
      // Reset dropdown content
      dropdownContent.innerHTML = '';
      dropdown.style.display = 'none';
      
      // Show all links initially
      Array.from(navLinks).forEach(link => {
        link.style.display = 'block';
      });
      
      // Check if navbar overflows
      const navRect = nav.getBoundingClientRect();
      const links = Array.from(navLinks);
      
      for (let i = links.length - 1; i >= 0; i--) {
        const link = links[i];
        const linkRect = link.getBoundingClientRect();
        
        if (linkRect.right > navRect.right - 100) { // Leave space for More dropdown
          // Move to dropdown
          link.style.display = 'none';
          dropdownContent.insertAdjacentHTML('afterbegin', 
            `<a href="${link.href}">${link.textContent}</a>`);
          dropdown.style.display = 'block';
        } else {
          break;
        }
      }
    }

    fetch('../pages.txt')
      .then(response => response.text())
      .then(data => {
        const links = data.split('\n');
        links.forEach(line => {
          if(line.trim()) {
            const [name, url] = line.split('|');
            const newUrl = url.startsWith('http') ? url : `${baseUrl}${url}`;
            document.getElementById('nav').insertAdjacentHTML('beforeend',
              `<a href="${newUrl}">${name}</a>`);
          }
        });
        
        // Check overflow after adding links
        checkOverflow();
        // Recheck on window resize
        window.addEventListener('resize', checkOverflow);
      });
  </script>
  <div class="header-container">
    <img src="image.jpg" alt="Header Image" class="header-image">
    <div class="header-text">
      Your Bold Header Text
    </div>
  </div>

  <div class="content">
    <h1>Header</h1>
    <p>Body</p>
    <p>Thank you for using Corelux!</p>
  </div>
</body>
</html>
