  <title>Corelux Credits</title>
  <style>
    .navbar {
      background-color: black;
      overflow: hidden;
      border: 1px solid #ccc;
      border-width: 1px 0;
      top: 0;
      width: 100%;
      position: fixed;
      z-index: 1000;
      display: flex;
      justify-content: space-around;
      padding: 0 20px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    .navbar a {
      color: white;
      text-align: center;
      padding: 14px 16px;
      text-decoration: none;
      font-weight: bold;
      display: block;
      position: relative;
    }

    .navbar a:hover, .dropdown:hover .dropbtn {
      background-color: #ddd;
      color: black;
    }

    .navbar .dropdown {
      display: inline-block;
      position: relative;
    }

    .navbar .dropdown-content {
      display: none;
      position: absolute;
      background-color: #f9f9f9;
      min-width: 160px;
      box-shadow: 0 8px 16px rgba(0,0,0,0.2);
      z-index: 1;
      top: 100%;
      left: 0;
    }

    .navbar .dropdown-content a {
      color: black;
      padding: 12px 16px;
      text-decoration: none;
      display: block;
      text-align: left;
    }

    .navbar .dropdown-content .dropdown {
      position: relative;
    }

    .navbar .dropdown-content .dropdown-content {
      left: 100%;
      top: 0;
    }

    .navbar .dropdown-content a:hover {
      background-color: #ddd;
    }

    .navbar .dropdown:hover .dropdown-content {
      display: block;
    }

    .navbar .more {
      display: none;
    }

    @media (max-width: 800px) {
      .navbar a:not(:first-child), .navbar .dropdown:not(:first-child) {
        display: none;
      }
      .navbar .more {
        display: block;
      }
    }

    @media (max-width: 800px) {
      .navbar.responsive {position: relative;}
      .navbar.responsive .more {
        position: absolute;
        right: 0;
        top: 0;
      }
      .navbar.responsive .dropdown-content {
        position: relative;
      }
      .navbar.responsive .navbar a {
        display: block;
        text-align: left;
      }
      .navbar.responsive .navbar .dropdown {float: none;}
      .navbar.responsive .navbar .dropdown-content {position: relative;}
      .navbar.responsive .navbar .dropdown .dropdown-content {position: absolute;}
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: black;
      padding-top: 50px; /* Adjust based on navbar height */
    }

    .content {
      padding: 20px;
      background-color: black;
      text-align: center;
      color: white;
    }

    .header-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .header-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: white;
      font-size: 6rem;
      font-weight: bold;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
      text-align: center;
    }

    .header-container {
      position: relative;
      width: 100%;
      height: 500px;
      overflow: hidden;
    }
  </style>
</head>
<body>
<div class="navbar" id="nav">
  <a href="javascript:void(0);" class="more" onclick="toggleNavbar()">☰ More</a>
</div>
<script>
  const baseUrl = window.location.origin;
  fetch('pages.txt')
    .then(response => response.text())
    .then(data => {
      const lines = data.split('\n');
      
      function createDropdown(name) {
        const dropdown = document.createElement('div');
        dropdown.className = 'dropdown';
        dropdown.innerHTML = `<a href="javascript:void(0);" class="dropbtn">${name}</a><div class="dropdown-content"></div>`;
        return dropdown;
      }

      function addLink(container, name, url) {
        const newUrl = url.startsWith('http') ? url : `${baseUrl}${url}`;
        container.innerHTML += `<a href="${newUrl.trim()}">${name.trim()}</a>`;
      }

      function processLines(lines, parentContainer) {
        let dropdown = null;
        lines.forEach(line => {
          line = line.trim();
          if (line.startsWith('Dropdown')) {
            const dropdownName = line.match(/(Dropdown\d+)/)[1].trim();
            dropdown = createDropdown(dropdownName);
            parentContainer.appendChild(dropdown);
            processLines(line.slice(line.indexOf('[') + 1, line.lastIndexOf(']')).split('\n'), dropdown.querySelector('.dropdown-content'));
          } else if (line && !line.startsWith('[') && !line.endsWith(']')) {
            const [name, url] = line.split('|');
            addLink(parentContainer, name, url);
          }
        });
      }

      processLines(lines, document.getElementById('nav'));
    });

  function toggleNavbar() {
    const navbar = document.getElementById("nav");
    if (navbar.className === "navbar") {
      navbar.className += " responsive";
    } else {
      navbar.className = "navbar";
    }
  }
</script>
<div class="header-container">
  <img src="image.jpg" alt="Header Image" class="header-image">
  <div class="header-text">
    Your Bold Header Text
  </div>
</div>

<div class="content">
  <h1>The Corelux HTML Crew</h1>
  <p>Being setup</p>
  <p>Thank you for using Corelux!</p>
</div>
</body>
</html>
