<!DOCTYPE html>
<html>
<head>
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-Y4LDHEQ6SL"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-Y4LDHEQ6SL');
</script>
  <title>Corelux</title>
  <style>
    .navbar {
      background-color: #202124;
      overflow: hidden;
      border-bottom: 1px solid #ccc;
      position: fixed;
      width: 100%;
      top: 0;
      z-index: 1000;
      padding: 10px 20px;
      display: flex;
      justify-content: space-between;
    }
    
    .navbar a {
      color: white;
      text-align: center;
      padding: 18px 20px;
      text-decoration: none;
      font-size: 18px;
      transition: background-color 0.3s, color 0.3s;
      border-radius: 4px;
    }
    
    .navbar a:hover {
      background-color: #5f6368;
      color: white;
    }
    
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: black;
      padding-top: 70px; /* Adjusted for the fixed navbar height */
    }
    
    .content {
      padding: 20px;
      background-color: black;
      text-align: center;
      color: white;
    }
    
    .header-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    
    .header-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: white;
      font-size: 6rem;
      font-weight: bold;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
      text-align: center;
    }
    
    .header-container {
      position: relative;
      width: 100%;
      height: 300px;
      overflow: hidden;
    }

    .dropdown {
      position: relative;
      display: inline-block;
    }

    .dropdown-content {
      display: none;
      position: absolute;
      background-color: #202124;
      min-width: 160px;
      box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.2);
      z-index: 1;
    }

    .dropdown-content a {
      color: white;
      padding: 12px 16px;
      text-decoration: none;
      display: block;
      text-align: left;
    }

    .dropdown-content a:hover {
      background-color: #5f6368;
    }

    .dropdown:hover .dropdown-content {
      display: block;
    }

    .dropdown:hover .dropbtn {
      background-color: #5f6368;
    }

    .dropbtn {
      background-color: #202124;
      color: white;
      padding: 18px 20px;
      font-size: 18px;
      border: none;
      cursor: pointer;
      border-radius: 4px;
    }
  </style>
</head>
<body>
<div class="navbar" id="nav"></div>
  <script>
    const baseUrl = window.location.origin;
    fetch('pages.txt')
      .then(response => response.text())
      .then(data => {
        const links = data.split('\n');
        const maxLinks = 5;
        let navHtml = '';
        let dropdownHtml = '<div class="dropdown"><button class="dropbtn">More</button><div class="dropdown-content">';
        links.forEach((line, index) => {
          if(line.trim()) {
            const [name, url] = line.split('|');
            const newUrl = url.startsWith('http') ? url : `${baseUrl}${url}`;
            if (index < maxLinks) {
              navHtml += `<a href="${newUrl}">${name}</a>`;
            } else {
              dropdownHtml += `<a href="${newUrl}">${name}</a>`;
            }
          }
        });
        dropdownHtml += '</div></div>';
        document.getElementById('nav').innerHTML = navHtml + dropdownHtml;
      });
  </script>
  <div class="header-container">
        <img src="image.jpg" alt="Header Image" class="header-image">
        <div class="header-text">
            Your Bold Header Text
        </div>
    </div>

  <div class="content">
    <h1>Header</h1>
    <p>Body</p>
    <p>Thank you for using Corelux!</p>
  </div>
</body>
</html>
