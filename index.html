  <title>Corelux Unblocking</title>
  <style>
    .navbar {
      background-color: #111; /* Darker background color */
      overflow: hidden;
      border-bottom: 1px solid #444;
      position: fixed;
      width: 100%;
      top: 0;
      z-index: 1000;
      padding: 5px 10px; /* Smaller padding */
    }
    
    .navbar a {
      float: left;
      color: white;
      text-align: center;
      padding: 18px 20px;
      text-decoration: none;
      font-size: 18px;
      transition: background-color 0.3s, color 0.3s;
      border-radius: 4px;
    }
    
    .navbar a:hover {
      background-color: #5f6368;
      color: white;
    }
    
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: black;
      padding-top: 50px; /* Adjusted for the fixed navbar height */
    }
    
    .content {
      padding: 20px;
      background-color: black;
      text-align: center;
      color: white;
    }
    
    .header-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
    }
    .header-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 6rem;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            text-align: center;
    }
    .header-container {
            position: relative;
            width: 100%;
            height: 300px;
            overflow: hidden;
        }
  </style>
</head>
<body>
<div class="navbar" id="nav"></div>
  <script>
      const baseUrl = window.location.origin;
      fetch('pages.txt')
        .then(response => response.text())
        .then(data => {
          const links = data.split('\n');
          links.forEach(line => {
            if(line.trim()) {
              const [name, url] = line.split('|');
              const newUrl = url.startsWith('http') ? url : `${baseUrl}${url}`;
              document.getElementById('nav').innerHTML += `<a href="${newUrl}">${name}</a>`;
            }
          });
        });
    </script>
  <div class="header-container">
        <img src="image.jpg" alt="Header Image" class="header-image">
        <div class="header-text">
            Corelux Unblocking
        </div>
    </div>

  <div class="content">
    <h1>Welcome To The Corelux HTML Site!</h1>
    <p>Why don't you look around or check out our much more developed google site!</p>
    <p>-Rayan, Owner and Founder of Corelux</p>
    <p>-Xman, Co-Owner of Corelux and Holder of corelux-unblocking.com</p>
  </div>
</body>
