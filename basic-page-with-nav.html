<!DOCTYPE html>
<html>
<head>
  <title>Page with Navigation Bar</title>
  <style>
    /* Navigation Bar Styles */
    .navbar {
      background-color: black;
      overflow: hidden;
    }
    
    .navbar a {
      float: left;
      color: white;
      text-align: center;
      padding: 14px 16px;
      text-decoration: none;
    }
    
    .navbar a:hover {
      background-color: #ddd;
      color: black;
    }
    
    /* Main Content Styles */
    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }
    
    .content {
      padding: 20px;
    }
  </style>
</head>
<body>
  <div class="navbar">
    <a href="#">Home</a>
    <a href="#">About</a>
    <a href="#">Services</a>
    <a href="#">Contact</a>
  </div>

  <div class="content">
    <h1>Welcome to the Page</h1>
    <p>This is the main content area of the page.</p>
  </div>
</body>
</html>
